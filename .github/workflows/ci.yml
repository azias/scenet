name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default. A job that needs more says so itself; nothing here does.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv resolves and installs the Python version itself, pinned by .python-version.
  UV_FROZEN: "1"

# Every third-party action is pinned to a full commit SHA with the tag in a comment.
# A mutable tag can be re-pointed at different code by whoever controls the repository,
# which is the standard supply-chain attack on Actions; a SHA cannot. Dependabot keeps
# these current -- see .github/dependabot.yml.

jobs:
  check:
    name: Lint, types and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor and is not decoration. Before Python 3.14 and PEP 649,
        # annotations are evaluated eagerly, so a self-referential `-> Point` inside
        # `class Point` raises NameError at import. Developing only on 3.14 hides that
        # entirely -- it surfaced first in the browser, where Pyodide ran an older
        # Python. This job is what stops it coming back.
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is not needed after checkout, and leaving it in the
          # local git config is how a later step exfiltrates it.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # --frozen fails if uv.lock is out of date with pyproject.toml, so a stale
      # lockfile is caught here rather than surfacing as a mystery later.
      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python ${{ matrix.python }}

      - name: Format
        if: matrix.python == '3.14'
        run: uv run ruff format --check .

      - name: Lint
        if: matrix.python == '3.14'
        run: uv run ruff check --output-format=github .

      - name: Types
        if: matrix.python == '3.14'
        run: uv run ty check

      # Runs the unit tests, every docstring example, and every fenced Python block in
      # the Markdown documentation. A documented example that no longer works fails
      # here, which is the whole point.
      - name: Tests, doctests and documentation examples
        run: uv run pytest

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen --group docs

      # -W turns warnings into errors: a broken cross-reference, a document missing
      # from the table of contents, or an autodoc import failure fails the build rather
      # than quietly producing a worse site.
      - name: Build the documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # Runtime dependencies only: these are what ship to users. Dev tooling is
      # never distributed, so it is deliberately out of scope here.
      - name: Sync runtime dependencies only
        run: uv sync --frozen --no-dev

      - name: Check licenses are permissive
        run: |
          uv pip install pip-licenses
          # --no-sync is essential: a bare `uv run` re-syncs the project and would
          # reinstall the dev dependencies that --no-dev just pruned, silently
          # checking the wrong environment.
          uv run --no-sync pip-licenses --format=markdown --with-urls
          ALLOWED=$(grep -v '^#' .github/allowed-licenses.txt | grep -v '^$' | paste -sd ';' -)
          uv run --no-sync pip-licenses --allow-only="$ALLOWED"

  typecheck-strict:
    name: Strict type check
    runs-on: ubuntu-latest
    # ty is pre-1.0 and is documented to miss some advanced typing patterns that pyright
    # catches, so this job covers the gap. It used to be `continue-on-error: true`, which
    # meant it failed on every single run while the run itself reported green -- 92
    # findings, of which 87 were untyped third-party libraries and nobody could act on
    # any of them. A red job inside a green run teaches you to ignore CI, which is worse
    # than having no job. The rules that only fire on untyped dependencies are now off,
    # what remains is actionable, and the job blocks.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run basedpyright

  examples:
    name: Gallery diagnostics
    runs-on: ubuntu-latest
    # The gallery is the language's shop window and the playground's contents. A false
    # positive here would make `scenet check` useless the first time anybody ran it, and
    # a real one means a published example does not compile.
    permissions:
      contents: read
      # Only this job, and only to upload the SARIF. Every other job in this file would
      # otherwise be able to write to the code-scanning database.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --frozen

      # The status is captured rather than allowed to end the job, so the findings still
      # reach code scanning when there are any -- which is the case the upload exists
      # for. The job fails afterwards, at the last step.
      - name: Check the gallery
        id: check
        run: |
          set +e
          uv run scenet check --format sarif -o results.sarif \
            examples/gallery/*.panel.yaml examples/gallery/*.scene.yaml
          echo "status=$?" >> "$GITHUB_OUTPUT"

      # A pull request from a fork gets a read-only token, so this cannot work there and
      # is skipped rather than failed. `continue-on-error` covers the other case: a
      # repository with code scanning not enabled, where the upload is rejected and that
      # is a configuration fact rather than a problem with the examples.
      - name: Upload to code scanning
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
          category: scenet-examples

      - name: Fail if the gallery has findings
        if: steps.check.outputs.status != '0'
        run: |
          echo "::error::scenet check reported findings in examples/gallery"
          exit 1

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    # The project rule is TypeScript wherever JavaScript would be used, with strict
    # enabled. That is only meaningful if something checks it.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Playground
        working-directory: playground
        run: |
          npm ci
          npm run typecheck
          npm run test

      # The step that actually assembles the playground, run here so that breaking it
      # fails a pull request rather than the Pages deploy after merge.
      #
      # That gap is not hypothetical: the wheel-freshness guard rejected every deploy
      # from 6a43750 onward while CI stayed green throughout, because `ci.yml` built the
      # documentation and `pages.yml` built the playground and only the latter ran this
      # script. Nobody looks at a workflow that does not run on their branch. (#14)
      #
      # The wheel has to exist first, and has to be built before anything imports
      # `scenet` -- the freshness check compares the two, which is the whole subject of
      # that issue.
      - name: Playground assets
        run: |
          uv build --wheel
          cd playground && npm run assets

      - name: Editor extension
        working-directory: editor
        run: |
          npm ci
          npm run typecheck
