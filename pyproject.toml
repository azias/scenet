[project]
name = "scenet"
version = "0.5.0"
description = "A semantic DSL for comic panels, compiled to SVG."
readme = "README.md"
requires-python = ">=3.12"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Scenet contributors" }]
keywords = ["comics", "dsl", "compiler", "svg", "layout", "constraint-solving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "kiwisolver>=1.4",
    "shapely>=2.0",
    "fonttools>=4.55",
    "numpy>=2.1",
    "fonts>=0.1",
    "font-source-sans-pro>=0.0.1",
]

# Deliberately no `author_email`. A published address on PyPI is a well-known spam
# magnet, and the project has no need for one: bug reports and questions belong in the
# issue tracker below, which PyPI renders as the contact route.
[project.urls]
Homepage = "https://github.com/azias/scenet"
Documentation = "https://azias.github.io/scenet/"
Repository = "https://github.com/azias/scenet"
Issues = "https://github.com/azias/scenet/issues"
Changelog = "https://github.com/azias/scenet/blob/main/CHANGELOG.md"
Playground = "https://azias.github.io/scenet/playground/"

[project.scripts]
scenet = "scenet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    # Executes the code blocks in docs/ and README.md as part of the test run, so a
    # documented example that is incomplete -- a missing import, most often -- fails
    # the build instead of wasting a reader's afternoon.
    "sybil>=10.1",
    "ruff>=0.14",
    "ty>=0.0.73",
    "basedpyright>=1.31",
    "pip-licenses>=5.0",
    "types-pyyaml>=6.0",
]
docs = [
    "sphinx>=9.1",
    "myst-parser>=5.1",
    "pydata-sphinx-theme>=0.20",
    "sphinx-design>=0.7",
    "sphinx-copybutton>=0.5.2",
    "sphinx-autodoc-typehints>=3.13",
    "sphinx-autobuild>=2025.8.25",
    "linkify-it-py>=2.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations  -- everything is typed
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TC",        # flake8-type-checking
    "PGH",       # pygrep-hooks -- PGH003 forbids bare `# type: ignore`
    "PT",        # pytest style
    "PL",        # pylint
    "RUF",       # ruff-specific
    "D",         # pydocstyle -- documentation is a deliverable here, so it is gated
    "S",         # flake8-bandit -- security
    "A",         # builtins shadowing
    "RET",       # return statements
    "PTH",       # prefer pathlib over os.path
    "TRY",       # exception antipatterns
]
ignore = [
    "PLR0913",  # many arguments: geometry/solver functions legitimately take several
    "PLR2004",  # magic values: the shot-type tables are full of deliberate constants
    # TRY003 wants long messages moved inside the exception class. Declined: a language
    # diagnostic is written for the person who wrote the panel, it names the offending
    # construct, and it is only meaningful at the point that construct was found. A
    # library of pre-baked message classes would make every one of them vaguer.
    "TRY003",
    # TRY004 wants a TypeError whenever an isinstance check fails. Malformed input here
    # raises from Scenet's own hierarchy instead, so that one `except ScenetError`
    # catches everything the compiler can object to. See src/scenet/errors.py.
    "TRY004",
    # TC001-TC003 want annotation-only imports moved into `if TYPE_CHECKING` blocks.
    # Declined deliberately, for two reasons:
    #   1. Pydantic resolves annotations at runtime to build validators. An import
    #      hidden behind TYPE_CHECKING makes the model fail to build, and the IR is
    #      pydantic models throughout -- so the rule is an active hazard here.
    #   2. The import-time saving the rule exists for is largely gone in Python 3.14:
    #      PEP 649 evaluates annotations lazily already.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.flake8-type-checking]
# Python 3.14 (PEP 649/749) evaluates annotations lazily by default, so runtime-only
# imports need no `if TYPE_CHECKING` dance and no `from __future__ import annotations`.
quote-annotations = false

[tool.ruff.lint.pydocstyle]
# Google style: readable in source, and understood by Sphinx's napoleon extension
# without further configuration.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests are not a published API: they need no annotations, assert freely, and their
# names document them better than a docstring would.
"tests/**" = [
    "ANN",
    "PLR2004",
    "S101",   # asserting is what tests do
    "S314",   # the XML being parsed is SVG this suite just generated
    "D",
    "RUF012", # parametrise tables on test classes are never mutated
    "SLF001", # tests may reach into private helpers; that is part of testing them
]
# `__all__` there is grouped by role -- compiling, parsing, rendering, errors -- with a
# comment per group. That is far more use to a reader than alphabetical order, and the
# test suite checks the contents rather than the arrangement.
"src/scenet/__init__.py" = ["RUF022"]
# Sphinx configuration is a script, not a module anyone imports.
"docs/conf.py" = ["D", "A", "INP"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

# ---------------------------------------------------------------- basedpyright (non-blocking)
[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false

# The reportUnknown* family is what `strict` turns on, and what an untyped dependency
# trips on every single value that flows out of it. `yaml.safe_load` returns Any,
# fontTools ships no stubs, and pytest's `capsys` fixture is untyped -- between them
# they produced 87 of 92 findings, none of which anybody can act on without writing
# stubs for somebody else's library.
#
# Turned off so that what remains is actionable, which is the only thing that justifies
# a gate. This job blocks the build; a gate whose output is ignored is worse than none.
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportMissingParameterType = false
# `elif isinstance(part, BlobPart)` after the Bone case: exhaustive by construction, and
# the check documents the union at the point of use. Keeping it is clearer than a bare
# `else` that silently accepts a third variant somebody adds later.
reportUnnecessaryIsInstance = false

# A test that cannot touch a private helper cannot test it. `ruff` is already told the
# same thing through SLF001 in per-file-ignores.
[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
# `--doctest-modules` is what makes every example in a docstring executable rather than
# decorative. An example that forgets an import fails here, which is the single most
# common complaint about Python library documentation.
testpaths = ["tests", "src", "docs", "README.md"]
addopts = """    -q --strict-markers --strict-config --doctest-modules     --cov=scenet --cov-report=term-missing --cov-fail-under=90"""
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["src/scenet"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
