[project]
name = "scenet"
version = "0.1.0"
description = "A semantic DSL for comic panels, compiled to SVG."
readme = "README.md"
requires-python = ">=3.14"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Scenet contributors" }]
keywords = ["comics", "dsl", "compiler", "svg", "layout", "constraint-solving"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Compilers",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "kiwisolver>=1.4",
    "shapely>=2.0",
    "fonttools>=4.55",
    "numpy>=2.1",
]

[project.scripts]
scenet = "scenet.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.14",
    "ty>=0.0.73",
    "basedpyright>=1.31",
    "pip-licenses>=5.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "ANN",       # flake8-annotations  -- everything is typed
    "B",         # flake8-bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "TC",        # flake8-type-checking
    "PGH",       # pygrep-hooks -- PGH003 forbids bare `# type: ignore`
    "PT",        # pytest style
    "PL",        # pylint
    "RUF",       # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments: geometry/solver functions legitimately take several
    "PLR2004",  # magic values: the shot-type tables are full of deliberate constants
    # TC001-TC003 want annotation-only imports moved into `if TYPE_CHECKING` blocks.
    # Declined deliberately, for two reasons:
    #   1. Pydantic resolves annotations at runtime to build validators. An import
    #      hidden behind TYPE_CHECKING makes the model fail to build, and the IR is
    #      pydantic models throughout -- so the rule is an active hazard here.
    #   2. The import-time saving the rule exists for is largely gone in Python 3.14:
    #      PEP 649 evaluates annotations lazily already.
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.flake8-type-checking]
# Python 3.14 (PEP 649/749) evaluates annotations lazily by default, so runtime-only
# imports need no `if TYPE_CHECKING` dance and no `from __future__ import annotations`.
quote-annotations = false

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- ty
[tool.ty.src]
include = ["src", "tests"]

[tool.ty.rules]
possibly-unresolved-reference = "error"

# ---------------------------------------------------------------- basedpyright (non-blocking)
[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
reportMissingTypeStubs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
xfail_strict = true
